<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whtamim — Motion Design & SaaS Video Studio</title>
    <meta name="description" content="Cinematic SaaS motion design & launch video studio by whtamim." />

    <!-- Brand Logo Preload to eliminate layout shifts -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

    <!-- Favicon & Icon Configurations -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android & PWA Manifest icons -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph SEO Metadata -->
    <meta property="og:title" content="whtamim — Motion Design & SaaS Video Studio" />
    <meta property="og:description" content="Cinematic SaaS motion design & product launch videos that elevate software brands." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/android-chrome-512x512.png" />

    <!-- Theme Mode Initialization Script to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('whtamim_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F5F7] dark:bg-[#0A0A0C] text-[#1D1D1F] dark:text-[#F5F5F7] antialiased selection:bg-[#FF1A00]/20 selection:text-[#FF1A00]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
