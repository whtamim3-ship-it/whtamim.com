<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whtamim — Motion Design & SaaS Video Studio</title>
    <meta name="description" content="Cinematic SaaS motion design & launch video studio by whtamim." />

    <!-- Brand Logo Preload to eliminate layout shifts -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Favicon & Icon Configurations -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android & PWA Manifest icons -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph SEO Metadata -->
    <meta property="og:title" content="whtamim — Motion Design & SaaS Video Studio" />
    <meta property="og:description" content="Cinematic SaaS motion design & product launch videos that elevate software brands." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/android-chrome-512x512.png" />

    <!-- Theme Mode Initialization Script to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('whtamim_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- SVG Motion Blur Filters for Cinematic Effects -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;">
      <filter id="motion-blur-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="16,1" />
      </filter>
      <filter id="cinematic-motion-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10,3" />
      </filter>
      <filter id="speed-blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="24,0" />
      </filter>
    </svg>
  </head>
  <body class="bg-[#F5F5F7] dark:bg-[#0A0A0C] text-[#1D1D1F] dark:text-[#F5F5F7] antialiased selection:bg-[#FF1A00]/20 selection:text-[#FF1A00]">
    <div id="root"></div>
    <script>
    if (!document.getElementById('videoLightbox')) {
        const overlay = document.createElement('div');
        overlay.id = 'videoLightbox';
        overlay.className = 'video-lightbox-overlay';
        overlay.innerHTML = '<div class="video-lightbox-container" id="videoContainer"><video autoplay muted playsinline controls id="lightboxVideo"><source src="" type="video/mp4"></video></div>';
        document.body.appendChild(overlay);
    }

    function openVideoLightbox(src) {
        const overlay = document.getElementById('videoLightbox');
        const container = document.getElementById('videoContainer');
        
        if (src.includes('drive.google.com')) {
            let embedUrl = src;
            if (embedUrl.includes('/view')) {
                embedUrl = embedUrl.replace(/\/view.*$/, '/preview');
            } else if (!embedUrl.includes('/preview')) {
                embedUrl = embedUrl + (embedUrl.endsWith('/') ? '' : '/') + 'preview';
            }
            container.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" allow="autoplay" style="border:none; width:100%; height:100%; display:block; background:#000;"></iframe>`;
            container.style.aspectRatio = "16/9";
        } else if (src.includes('youtube.com') || src.includes('youtu.be')) {
            let ytId = '';
            if (src.includes('youtu.be/')) {
                ytId = src.split('youtu.be/')[1]?.split('?')[0];
            } else if (src.includes('v=')) {
                ytId = src.split('v=')[1]?.split('&')[0];
            } else if (src.includes('embed/')) {
                ytId = src.split('embed/')[1]?.split('?')[0];
            }
            container.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" width="100%" height="100%" allow="autoplay; encrypted-media" style="border:none; width:100%; height:100%; display:block; background:#000;"></iframe>`;
            container.style.aspectRatio = "16/9";
        } else {
            container.innerHTML = `<video autoplay muted playsinline controls id="lightboxVideo"><source src="${src}" type="video/mp4"></video>`;
            const video = document.getElementById('lightboxVideo');
            if (video) {
                video.src = src;
                video.onloadedmetadata = function() {
                    const width = video.videoWidth;
                    const height = video.videoHeight;
                    if (width && height) {
                        container.style.aspectRatio = width / height;
                    }
                };
                video.play().catch(() => {});
            }
        }
        
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeVideoLightbox() {
        const overlay = document.getElementById('videoLightbox');
        if (overlay) {
            overlay.classList.remove('active');
        }
        const container = document.getElementById('videoContainer');
        if (container) {
            container.innerHTML = '<video autoplay muted playsinline controls id="lightboxVideo"><source src="" type="video/mp4"></video>';
        }
        document.body.style.overflow = 'auto';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeVideoLightbox();
    });

    document.getElementById('videoLightbox').addEventListener('click', (e) => {
        if (e.target.id === 'videoLightbox') closeVideoLightbox();
    });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
