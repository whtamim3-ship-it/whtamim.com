    <!-- Fetch API compatibility patch for iframe/getter-only window environments -->
    <script>
      (function() {
        try {
          var origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          var getter = function() { return currentFetch || (origFetch ? origFetch : window.fetch); };
          var setter = function(v) { currentFetch = v; };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getter,
              set: setter,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
